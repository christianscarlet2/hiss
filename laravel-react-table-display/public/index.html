<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hiss React Table Display</title>
    <link rel="stylesheet" href="/table-display/assets/app.css?v=31" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Clever, styled "Scarlet Beast" loader: dual counter-spinning rings, a pulsing spade core, the
         wordmark, and cycling poker/AI status lines. Matches the boot loader; stays until the ENTIRE table
         view is rendered WITH data (not just first React mount). [Emrald: clever loader, full-ready] -->
    <div id="hiss-loader" aria-label="loading">
      <div class="hl-orb"><div class="hl-ring"></div><div class="hl-ring2"></div><div class="hl-core"></div><div class="hl-suit">&#9824;</div></div>
      <div class="hl-brand">SCARLET&nbsp;BEAST</div>
      <div class="hl-msg" id="hl-msg">Waking the Scarlet Beast&hellip;</div>
    </div>
    <style>
      html,body{margin:0;background:#0a0405}
      #hiss-loader{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;
        flex-direction:column;background:radial-gradient(circle at 50% 42%,#220709,#0a0405 65%,#000);
        font-family:'Segoe UI',system-ui,sans-serif;transition:opacity .45s ease}
      #hiss-loader.hl-gone{opacity:0;pointer-events:none}
      #hiss-loader .hl-orb{position:relative;width:140px;height:140px;display:flex;align-items:center;justify-content:center}
      #hiss-loader .hl-ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(224,70,85,.12);
        border-top-color:#ff2740;border-right-color:#e04655;animation:hl-sp 1s linear infinite;box-shadow:0 0 30px rgba(255,39,64,.4)}
      #hiss-loader .hl-ring2{position:absolute;inset:16px;border-radius:50%;border:2px solid rgba(224,70,85,.10);
        border-bottom-color:#ff5566;animation:hl-sp 1.6s linear infinite reverse}
      #hiss-loader .hl-core{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#ff3b4d,#9b0718);
        box-shadow:0 0 34px 8px rgba(255,40,64,.55);animation:hl-pu 1.2s ease-in-out infinite}
      #hiss-loader .hl-suit{position:absolute;font-size:22px;color:#1a0405;animation:hl-pu 1.2s ease-in-out infinite}
      #hiss-loader .hl-brand{margin-top:30px;font-weight:800;font-size:16px;letter-spacing:.42em;padding-left:.42em;
        color:#ff5566;text-shadow:0 0 16px rgba(255,40,64,.8)}
      #hiss-loader .hl-msg{margin-top:14px;min-height:18px;font-family:Consolas,monospace;font-size:13px;
        letter-spacing:.08em;color:#c98b96;transition:opacity .25s}
      @keyframes hl-sp{to{transform:rotate(360deg)}}
      @keyframes hl-pu{0%,100%{transform:scale(.8);opacity:.85}50%{transform:scale(1.12);opacity:1}}
    </style>
    <script>
      (function(){ var M=["Waking the Scarlet Beast…","Shuffling fifty-two truths…","Reading the felt…",
        "Counting outs and souls…","Tuning the synapses…","Consulting Jasper…","Stacking the odds…",
        "Sharpening the read…"], i=0, e=document.getElementById('hl-msg');
        setInterval(function(){ i=(i+1)%M.length; if(e){ e.style.opacity=0; setTimeout(function(){ e.textContent=M[i]; e.style.opacity=1; },250); } },2200); })();
    </script>
    <!-- Game-type indicator (NLH / PLO / PLO8). Self-contained overlay; reads the cheap, stable
         isomaha/isplo8/ispl symbols (ispl is set whenever the table is detected Omaha, so the badge
         stays correct between hands when isomaha hasn't latched yet). No React-bundle dependency. -->
    <div id="gametype-badge" title="Game type. Click to override it (NLH / PLO / PLO8) or clear the game state. An override forces BOTH the strategy tree and the tablemap." style="position:fixed;top:8px;left:8px;z-index:99999;padding:3px 11px;border-radius:7px;font:700 14px system-ui,Segoe UI,sans-serif;color:#fff;background:#1f3a5f;border:1px solid rgba(255,255,255,.30);box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer;user-select:none">NLH</div>
    <div id="gametype-menu" style="position:fixed;top:34px;left:8px;z-index:100000;display:none;min-width:186px;
         background:#15161a;border:1px solid rgba(255,255,255,.16);border-radius:8px;
         box-shadow:0 8px 24px rgba(0,0,0,.6);padding:4px;
         font:600 13px system-ui,Segoe UI,sans-serif;color:#dfe3e0;user-select:none"></div>
    <script>
      (function(){
        // Game-type badge + MANUAL OVERRIDE menu.
        //
        // Auto-detection reads the hero's hole-card count and the table title, and both lie: title OCR
        // is unreliable and a fresh felt has no cards to count. When it latches wrong, the bot plays the
        // wrong strategy tree on the wrong tablemap. This lets you just state the truth: the override
        // forces the symbols (isomaha/isplo8 -> the f$preflop dispatch) AND the tablemap (the base map
        // for NLH, the "_omaha" map for PLO/PLO8), and it sticks until you clear it.
        var el=document.getElementById('gametype-badge');
        var menu=document.getElementById('gametype-menu');
        var busy=0;             // suppress polling briefly while a change is in flight
        var override='auto';    // 'auto' | 'nlh' | 'plo' | 'plo8'
        var effective='nlh';    // what the table is actually playing as right now

        var STYLE={ nlh:{label:'NLH',bg:'#1f3a5f'}, plo:{label:'PLO',bg:'#1e5631'}, plo8:{label:'PLO8',bg:'#7b341e'} };

        function paintBadge(){
          var s=STYLE[effective]||STYLE.nlh;
          // A manual override is PINNED: show the pin so it is obvious the badge is being forced and
          // not detected -- a silent override is how you end up debugging the wrong thing for an hour.
          el.textContent = (override!=='auto' ? '📌 ' : '') + s.label;
          el.style.background = s.bg;
          el.style.borderColor = (override!=='auto') ? 'rgba(255,214,102,.85)' : 'rgba(255,255,255,.30)';
        }

        function row(key,label,danger,disabled){
          var d=document.createElement('div');
          // The tick marks the ACTIVE override -- i.e. what the bot is being FORCED to play as, not
          // merely what it detected. That distinction is the whole point of the menu.
          var checked=(override===key);
          d.setAttribute('role','menuitem');
          d.tabIndex = disabled ? -1 : 0;
          d.style.cssText='display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:5px;'
            + (disabled ? 'cursor:default;opacity:.38;' : 'cursor:pointer;')
            + (danger?'color:#ff8189;margin-top:4px;border-top:1px solid rgba(255,255,255,.10);padding-top:9px;':'');
          d.innerHTML='<span style="width:12px;display:inline-block;color:#ffd666">'+(checked?'✓':'')+'</span>'
                    + '<span>'+label+'</span>';
          if(!disabled){
            d.onmouseenter=function(){ d.style.background='rgba(255,255,255,.08)'; };
            d.onmouseleave=function(){ d.style.background='transparent'; };
            d.onclick=function(ev){ ev.stopPropagation(); choose(key); };
            d.onkeydown=function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); choose(key); } };
          } else {
            d.onclick=function(ev){ ev.stopPropagation(); };   // nothing to clear
          }
          return d;
        }

        function paintMenu(){
          menu.innerHTML='';
          menu.appendChild(row('nlh','NLH'));
          menu.appendChild(row('plo','PLO'));
          menu.appendChild(row('plo8','PLO8'));
          // Two DIFFERENT clears, and the difference matters:
          //   CLEAR OVERRIDE  -> hand the game type back to auto-detection (drops the pin)
          //   CLEAR GAME STATE -> wipe this table's cached gamestate/symbols/scrapes. It does NOT
          //                       touch the override: an override holds for the whole Hiss session
          //                       until you clear it yourself.
          menu.appendChild(row('auto','CLEAR OVERRIDE', false, override==='auto'));
          menu.appendChild(row('clear','CLEAR GAME STATE', true));
        }

        function openMenu(open){
          menu.style.display = open ? 'block' : 'none';
          if(open){ paintMenu(); }
        }

        function choose(key){
          openMenu(false);
          busy=Date.now()+1500;
          if(key==='clear'){
            // CLEAR GAME STATE: wipe this table's cached gamestate/symbols/scrapes so the engine
            // re-reads everything from a clean slate. It does NOT drop the override -- that is
            // CLEAR OVERRIDE's job, and conflating the two would throw away your correction every
            // time you tried to un-stick a bad scrape.
            el.textContent='...'; el.style.background='#444';
            fetch('/api/reset-detection').then(function(r){return r.json();})
              .then(function(){ setTimeout(upd,800); })
              .catch(function(){ busy=0; });
            return;
          }
          fetch('/api/gametype?set='+encodeURIComponent(key)).then(function(r){return r.json();})
            .then(function(d){ if(d){ override=d.override||'auto'; effective=d.effective||effective; } paintBadge(); setTimeout(upd,600); })
            .catch(function(){ busy=0; });
        }

        function upd(){
          if(busy && Date.now()<busy) return;
          busy=0;
          fetch('/api/gametype',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
            if(!d) return;
            override = d.override || 'auto';
            effective = d.effective || 'nlh';
            paintBadge();
            if(menu.style.display==='block') paintMenu();   // keep the tick in sync while it is open
          }).catch(function(){});
        }

        el.onclick=function(ev){ ev.stopPropagation(); openMenu(menu.style.display!=='block'); };
        document.addEventListener('click', function(){ openMenu(false); });
        document.addEventListener('keydown', function(ev){ if(ev.key==='Escape') openMenu(false); });

        upd(); setInterval(upd,1000);
      })();
    </script>
    <!-- FCKRA (primary, bottom-right) + TIOLP (secondary, bottom-left) clickable-button indicators +
         Observer/Playing footer, mirroring the main table-view corner indicators. Self-contained;
         polls /api/table-state (fckra/tiolp/observer). [Emrald] -->
    <div id="ind-fckra" style="position:fixed;right:8px;bottom:6px;z-index:99999;display:flex;gap:3px"></div>
    <div id="ind-tiolp" style="position:fixed;left:8px;bottom:6px;z-index:99999;display:flex;gap:3px"></div>
    <div id="ind-mode"  style="position:fixed;left:50%;bottom:7px;transform:translateX(-50%);z-index:99999;font:700 12px system-ui,sans-serif;letter-spacing:.5px;color:#9aa"></div>
    <script>
      (function(){
        function cells(hostId, letters, lit){
          var h=document.getElementById(hostId); if(!h) return;
          var html='';
          for(var i=0;i<letters.length;i++){
            var on=(lit||'').indexOf(letters[i])>=0;
            html += '<span style="display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;'
              + 'border-radius:3px;font:700 11px monospace;'
              + (on ? 'background:#2e7d32;color:#fff;box-shadow:0 0 5px rgba(60,255,90,.7)'
                    : 'background:#1c1c20;color:#555;border:1px solid #333')
              + '">'+letters[i]+'</span>';
          }
          h.innerHTML=html;
        }
        function upd(){
          fetch('/api/table-state?_='+Date.now()).then(function(r){return r.json();}).then(function(d){
            cells('ind-fckra','FCKRA', d.fckra);
            cells('ind-tiolp','TIOLP', d.tiolp);
            var m=document.getElementById('ind-mode'); if(m) m.textContent = d.observer ? 'Observer Mode' : 'Playing Mode';
          }).catch(function(){});
        }
        upd(); setInterval(upd,700);
      })();
    </script>
    <!-- Replayer playback indicator (right-hand side, BELOW the topbar). Polls the replayer control
         server (:8089) /status: glows RED with the hand number while replayer.exe is playing back, dim
         grey when off. So you always know whether the desktop replayer is running. Self-contained; the
         control server is CORS-open. [Emrald: show replayer on/off in the table view]

         Sits at top:54px, not top:8px: .topbar is 46px tall and lays its controls out with
         justify-content:space-between, so its RIGHT-hand button group lands exactly where this badge
         used to be pinned -- the two overlapped. 46px topbar + an 8px gap = 54px. If the topbar's
         height ever changes, these two offsets move with it. -->
    <div id="ind-replayer" title="Desktop replayer.exe playback (control server :8089)"
         style="position:fixed;top:54px;right:8px;z-index:99999;padding:3px 11px;border-radius:7px;
                font:700 13px system-ui,Segoe UI,sans-serif;color:#7a8a80;background:#1c1c20;
                border:1px solid rgba(255,255,255,.18);box-shadow:0 1px 4px rgba(0,0,0,.45);
                user-select:none;transition:all .2s">&#9679; REPLAYER OFF</div>
    <script>
      (function(){
        var el=document.getElementById('ind-replayer');
        var CTRL='http://192.168.1.137:8089';   // replayer control server on BEAST (LAN-reachable)
        function on(txt){ el.textContent=txt;
          el.style.background='#2a0b10'; el.style.color='#ff5566';
          el.style.borderColor='rgba(255,40,64,.6)'; el.style.boxShadow='0 0 10px rgba(255,40,64,.6)'; }
        function off(txt,col){ el.textContent=txt;
          el.style.background='#1c1c20'; el.style.color=col||'#7a8a80';
          el.style.borderColor='rgba(255,255,255,.16)'; el.style.boxShadow='0 1px 4px rgba(0,0,0,.45)'; }
        function upd(){
          fetch(CTRL+'/status',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
            if(!el) return;
            if(d && d.playing){ on('▶ REPLAYER'+(d.hand?(' · '+d.hand):' ON')); }
            else { off('● REPLAYER OFF'); }
          }).catch(function(){ if(el) off('● REPLAYER —','#555'); });  // control server down -> unknown
        }
        upd(); setInterval(upd,1500);
      })();
    </script>
    <!-- Autoplayer on/off indicator (right-hand side, just below the replayer badge). Polls Hiss's own
         /api/autoplayer (a bare GET only REPORTS {engaged}, never toggles); glows GREEN while the bot
         is auto-playing, dim grey when off. Same-origin. [Emrald: show autoplayer on/off in table view]
         top:84px = the replayer badge at 54px + the same 30px spacing the pair always had. -->
    <div id="ind-autoplayer" title="Autoplayer engaged state (Hiss /api/autoplayer)"
         style="position:fixed;top:84px;right:8px;z-index:99999;padding:3px 11px;border-radius:7px;
                font:700 13px system-ui,Segoe UI,sans-serif;color:#7a8a80;background:#1c1c20;
                border:1px solid rgba(255,255,255,.18);box-shadow:0 1px 4px rgba(0,0,0,.45);
                user-select:none;transition:all .2s">&#9679; AUTOPLAYER OFF</div>
    <script>
      (function(){
        var el=document.getElementById('ind-autoplayer');
        function on(txt){ el.textContent=txt;
          el.style.background='#0e2a16'; el.style.color='#3fb950';
          el.style.borderColor='rgba(63,185,80,.6)'; el.style.boxShadow='0 0 10px rgba(63,185,80,.55)'; }
        function off(txt,col){ el.textContent=txt;
          el.style.background='#1c1c20'; el.style.color=col||'#7a8a80';
          el.style.borderColor='rgba(255,255,255,.16)'; el.style.boxShadow='0 1px 4px rgba(0,0,0,.45)'; }
        function upd(){
          fetch('/api/autoplayer',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
            if(!el) return;
            if(d && d.engaged){ on('● AUTOPLAYER ON'); }
            else { off('● AUTOPLAYER OFF'); }
          }).catch(function(){ if(el) off('● AUTOPLAYER —','#555'); });  // Hiss unreachable -> unknown
        }
        upd(); setInterval(upd,1200);
      })();
    </script>
    <script src="/table-display/assets/react.production.min.js"></script>
    <script src="/table-display/assets/react-dom.production.min.js"></script>
    <script src="/table-display/assets/app.js?v=35"></script>
    <script>
      // Self-refresh the React table view every 10 minutes to release accumulated WebView2/browser memory.
      // The red loader re-shows on each reload, so it stays smooth. [Emrald: refresh table view to save memory]
      setInterval(function(){ try{ location.reload(); }catch(e){} }, 10 * 60 * 1000);
    </script>
    <script>
      // Keep the loader until the ENTIRE table view is READY: (1) React has rendered a real table subtree
      // into #root (not an empty shell), (2) the backend port is serving real table-state data, and (3) a
      // short paint-settle has elapsed. Only then fade it out. 15s hard safety so it never traps. [Emrald]
      (function(){
        var L=document.getElementById('hiss-loader'); if(!L) return;
        var root=document.getElementById('root');
        var mounted=false, dataReady=false, settled=false, dead=false;
        function gone(){ if(dead) return; dead=true; L.classList.add('hl-gone');
          setTimeout(function(){ if(L&&L.parentNode) L.parentNode.removeChild(L); },600); }
        function maybe(){ if(mounted && dataReady && settled) gone(); }
        function checkMount(){ if(root && root.querySelectorAll('*').length > 8){ mounted=true; maybe(); return true; } return false; }
        function checkData(){ if(dead) return;
          fetch('/api/table-state',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
            if(d && (d.handnumber || (d.players && d.players.length))){ dataReady=true; maybe(); }
            else setTimeout(checkData,500);
          }).catch(function(){ setTimeout(checkData,800); });
        }
        if(!checkMount()){
          var obs=new MutationObserver(function(){ checkMount(); });
          try{ obs.observe(root,{childList:true,subtree:true}); }catch(e){}
        }
        checkData();
        var iv=setInterval(function(){ if(mounted && dataReady){ clearInterval(iv); setTimeout(function(){ settled=true; maybe(); },500); } if(dead) clearInterval(iv); },150);
        setTimeout(gone, 15000);
      })();
    </script>
  </body>
</html>
