<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hiss React Table Display</title>
    <link rel="stylesheet" href="/table-display/assets/app.css?v=27" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Game-type indicator (NLH / PLO / PLO8). Self-contained overlay; reads the cheap, stable
         isomaha/isplo8/ispl symbols (ispl is set whenever the table is detected Omaha, so the badge
         stays correct between hands when isomaha hasn't latched yet). No React-bundle dependency. -->
    <div id="gametype-badge" title="Detected game type. Click to CLEAR gamestate/symbols/scrapes and force a clean re-detect (backup if it's stuck on the wrong type)." style="position:fixed;top:8px;left:8px;z-index:99999;padding:3px 11px;border-radius:7px;font:700 14px system-ui,Segoe UI,sans-serif;color:#fff;background:#1f3a5f;border:1px solid rgba(255,255,255,.30);box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer;user-select:none">NLH</div>
    <script>
      (function(){
        var el=document.getElementById('gametype-badge');
        var resetting=0;   // suppress the poll label briefly while a reset is in flight
        function upd(){
          if(resetting && Date.now()<resetting) return;
          fetch('/api/symbols?names=isomaha,isplo8,ispl').then(function(r){return r.json();}).then(function(d){
            var omaha=(+d.isomaha)>0, plo8=(+d.isplo8)>0, pl=(+d.ispl)>0;
            var label='NLH', bg='#1f3a5f';
            if(plo8){ label='PLO8'; bg='#7b341e'; }
            else if(omaha||pl){ label='PLO'; bg='#1e5631'; }
            if(el){ el.textContent=label; el.style.background=bg; }
          }).catch(function(){});
        }
        // BACKUP: click the badge -> confirm -> clear the per-table gamestate/symbols/scrapes so the
        // engine re-detects the game type from a clean slate (hole-card count). [Emrald]
        if(el){ el.onclick=function(){
          if(!confirm('Clear gamestate, symbols and scrapes for this table and force a clean game-type re-detect?')) return;
          el.textContent='...'; el.style.background='#444'; resetting=Date.now()+2500;
          fetch('/api/reset-detection').then(function(r){return r.json();}).then(function(){
            setTimeout(upd,800);   // let the next heartbeats re-detect, then resume polling
          }).catch(function(){ resetting=0; });
        }; }
        upd(); setInterval(upd,1000);
      })();
    </script>
    <script src="/table-display/assets/react.production.min.js"></script>
    <script src="/table-display/assets/react-dom.production.min.js"></script>
    <script src="/table-display/assets/app.js?v=30"></script>
  </body>
</html>
